<!doctype html>
<!--
  GitHub Pages ne sait servir que des fichiers statiques réels : ouvrir directement
  (ou actualiser) une URL gérée uniquement côté client comme /Onside/scores renvoie
  un vrai 404 serveur. Cette page réencode le chemin demandé dans le paramètre "p" et
  redirige vers index.html, qui le restitue ensuite via history.replaceState (voir le
  script correspondant dans index.html). Technique standard : rafgraph/spa-github-pages.
-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      var segmentsToKeep = 1 // garde "/Onside" comme préfixe de base
      var l = window.location
      var path = l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?p=' +
        l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      l.replace(path)
    </script>
  </head>
  <body></body>
</html>
