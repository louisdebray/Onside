<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Onside</title>
    <script>
      // Contrepartie de public/404.html : restitue l'URL réelle avant que React
      // Router ne s'initialise, pour qu'un lien direct ou une actualisation sur une
      // sous-page (ex: /Onside/scores) fonctionne comme si GitHub Pages savait
      // vraiment router ça côté serveur.
      (function () {
        var params = new URLSearchParams(window.location.search)
        var redirectPath = params.get('p')
        if (redirectPath === null) return
        var query = params.get('q')
        var newUrl =
          window.location.pathname.replace(/\/$/, '') +
          '/' +
          redirectPath +
          (query ? '?' + query : '') +
          window.location.hash
        window.history.replaceState(null, '', newUrl)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
