# Déploie les deux services (backend Node + micro-service Python Transfermarkt) sur
# Render en un clic via "New +" > "Blueprint" dans le tableau de bord Render, en
# pointant vers ce repo. Les variables marquées "sync: false" ne sont PAS dans ce
# fichier (aucun secret dans le repo) : Render les demande une par une pendant la
# création du blueprint, à remplir avec les valeurs de backend/.env — sauf
# TRANSFERMARKT_SERVICE_URL, à laisser vide au premier déploiement et à renseigner
# ensuite avec l'URL publique du service "onside-transfermarkt" (visible dans le
# tableau de bord Render une fois ce service déployé), puis redéployer le backend.
services:
  - type: web
    name: onside-backend
    runtime: node
    plan: free
    rootDir: onside-github-1/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: MYMEMORY_CONTACT_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TRANSFERMARKT_SERVICE_URL
        sync: false

  - type: web
    name: onside-transfermarkt
    runtime: docker
    plan: free
    rootDir: onside-github-2/transfermarkt-service
    dockerfilePath: ./Dockerfile
